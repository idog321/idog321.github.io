<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">Add Route stop fields: a stop added by tapping the map, one picked from search, the two reordered by dragging, and the end of the list at 14 stops reading "14 stops is the most"</title>
<style>
text{font-family:-apple-system,system-ui,sans-serif;font-size:17px;fill:#000}
.sec{fill:#3C3C43;fill-opacity:.6}
.ph{fill:#3C3C43;fill-opacity:.3}
.badge{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle}
.bold{font-weight:700}
.fld{fill:#3C3C43;fill-opacity:.18}
.ter{fill:#3C3C43;fill-opacity:.3}
.hdl{stroke:#3C3C43;stroke-opacity:.3;stroke-width:2;stroke-linecap:round}
.or{fill:#FF9500}
.a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
#bottom,#list{animation-name:bottom}
@keyframes bottom{0%,13%{transform:translateY(0)}15%,31%{transform:translateY(42px)}33%,49%{transform:translateY(93px)}51%,100%{transform:translateY(84px)}}
#empty,#hint{animation-name:empty}
@keyframes empty{0%,13%{transform:translateY(0)}15%,49%{transform:translateY(42px)}51%,100%{transform:translateY(84px)}}
.hintop{animation-name:hintop}
@keyframes hintop{0%,30%{opacity:1}31%,100%{opacity:0}}
.pStart{animation-name:pStart}
@keyframes pStart{0%,13%{opacity:1}14%,100%{opacity:0}}
.pNext{animation-name:pNext}
@keyframes pNext{0%,13%{opacity:0}14%,29%{opacity:1}30%,100%{opacity:0}}
.typed,.clear,.results{animation-name:typed}
@keyframes typed{0%,29%{opacity:0}30%,49%{opacity:1}50%,100%{opacity:0}}
.focus{animation-name:focus}
@keyframes focus{0%,23%{opacity:0}24%,100%{opacity:1}}
.loc{animation-name:loc}
@keyframes loc{0%,29%{opacity:1}30%,49%{opacity:0}50%,100%{opacity:1}}
.pAdd,.line1,.dot2,.rowB,.leg{animation-name:pAdd}
@keyframes pAdd{0%,49%{opacity:0}50%,100%{opacity:1}}
.rowA,.dot1{animation-name:rowA}
@keyframes rowA{0%,13%{opacity:0}14%,100%{opacity:1}}
#moveB{animation-name:moveB}
@keyframes moveB{0%,64%{transform:translateY(0)}74%,100%{transform:translateY(-42px)}}
#moveA{animation-name:moveA}
@keyframes moveA{0%,66%{transform:translateY(0)}74%,100%{transform:translateY(42px)}}
.n1{animation-name:n1}
@keyframes n1{0%,74%{opacity:1}75%,100%{opacity:0}}
.n2{animation-name:n2}
@keyframes n2{0%,74%{opacity:0}75%,100%{opacity:1}}
.t1{animation-name:t1}
@keyframes t1{0%,8%{opacity:0}10%,12%{opacity:1}14%,100%{opacity:0}}
.t2{animation-name:t2}
@keyframes t2{0%,21%{opacity:0}23%,24%{opacity:1}26%,100%{opacity:0}}
.t3{animation-name:t3}
@keyframes t3{0%,44%{opacity:0}46%,47%{opacity:1}49%,100%{opacity:0}}
.t4{animation-name:t4}
@keyframes t4{0%,60%{opacity:0;transform:translateY(0)}62%,64%{opacity:1;transform:translateY(0)}74%{opacity:1;transform:translateY(-42px)}76%,100%{opacity:0;transform:translateY(-42px)}}
@media (prefers-reduced-motion:reduce){.a{animation-play-state:paused!important;animation-delay:-15.9s!important}}
</style>
<defs>
<linearGradient id="fdn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<clipPath id="card"><rect x="256" y="16" width="368" height="400" rx="20"/></clipPath>
</defs>
<rect width="640" height="400" fill="#E8E6E1"/>
<!-- map: plain ground, the leg still being asked (dashed, route style), stop dots (12pt, route orange, white 1.5 ring) and touches -->
<line class="a leg" x1="110" y1="110" x2="176" y2="262" stroke="#FF9500" stroke-opacity=".9" stroke-width="5" stroke-dasharray="10 6" stroke-linecap="round"/>
<circle class="a t1" cx="110" cy="110" r="18" style="fill:#000;fill-opacity:.18"/>
<circle class="a dot1" cx="110" cy="110" r="5.25" fill="#FF9500" stroke="#fff" stroke-width="1.5"/>
<circle class="a dot2" cx="176" cy="262" r="5.25" fill="#FF9500" stroke="#fff" stroke-width="1.5"/>
<!-- card, cut off flat under its content: the divider and action row below are left out -->
<g clip-path="url(#card)"><g id="bottom" class="a"><rect x="256" y="-300" width="368" height="403" fill="#fff"/><rect x="256" y="103" width="368" height="10" fill="url(#fdn)"/></g></g>
<!-- stop 1 (St Mary's Ln), tapped onto the map -->
<g transform="translate(0,28)"><g id="moveA" class="a"><g class="a rowA">
<rect x="272" width="336" height="36" rx="10" class="fld"/>
<circle cx="293" cy="18" r="13" class="or"/>
<text class="a n1 badge" x="293" y="23">1</text><text class="a n2 badge" x="293" y="23">2</text>
<text x="314" y="24">St Mary's Ln</text>
<line x1="560" y1="18" x2="576" y2="18" class="hdl"/>
<circle cx="592" cy="18" r="8" class="ter"/>
</g></g></g>
<!-- stop 2 (Mill Pond), picked from search -->
<g transform="translate(0,70)"><g id="moveB" class="a"><g class="a rowB">
<rect x="272" width="336" height="36" rx="10" class="fld"/>
<circle cx="293" cy="18" r="13" class="or"/>
<text class="a n1 badge" x="293" y="23">2</text><text class="a n2 badge" x="293" y="23">1</text>
<text x="314" y="24">Mill Pond</text>
<line x1="560" y1="18" x2="576" y2="18" class="hdl"/>
<circle cx="592" cy="18" r="8" class="ter"/>
</g></g></g>
<g transform="translate(0,70)"><circle class="a t4" cx="568" cy="18" r="18" style="fill:#000;fill-opacity:.18"/></g>
<!-- the empty field: keeps its focus after the pick on the floating card -->
<g id="empty" class="a"><g transform="translate(0,28)">
<rect x="272" width="336" height="36" rx="10" class="fld"/>
<rect class="a focus" x="272" width="336" height="36" rx="10" fill="none" stroke="#FF9500" stroke-width="1.5"/>
<circle cx="287" cy="18" r="6" fill="none" stroke="#3C3C43" stroke-opacity=".6" stroke-width="2"/>
<text class="a pStart ph" x="303" y="24">Start</text>
<text class="a pNext ph" x="303" y="24">Next stop</text>
<text class="a pAdd ph" x="303" y="24">Add a stop</text>
<text class="a typed" x="303" y="24">Mill Pond</text>
<path class="a loc" fill="#FF9500" transform="translate(585,10.5) scale(0.0768)" d="M 13.877784 105.489586 L 89.920944 105.802452 C 91.485565 105.802452 92.007149 106.324028 92.007149 107.88855 L 92.215759 183.306412 C 92.215759 198.848007 110.887787 202.498947 117.876694 187.373932 L 194.963013 21.622971 C 201.95192 6.393509 189.955536 -3.620407 175.351761 3.159851 L 8.662184 80.454803 C -4.689703 86.609169 -2.081908 105.385239 13.877784 105.489586 Z"/>
<circle class="a clear" cx="592" cy="18" r="8" style="fill:#3C3C43;fill-opacity:.3"/>
<circle class="a t2" cx="400" cy="18" r="18" style="fill:#000;fill-opacity:.18"/>
</g></g>
<!-- under the fields: the hint before two stops -->
<g id="hint" class="a"><g class="a hintop">
<circle cx="279" cy="80" r="7" class="or"/>
<path fill="#FF9500" transform="translate(289,77.5) scale(0.045)" d="M 101.057533 113.528603 C 103.93605 113.528603 106.814575 112.376678 108.771904 110.189545 L 197.890854 18.882629 C 199.848068 16.925194 201 14.392136 201 11.513611 C 201 5.526199 196.509033 0.920609 190.521835 0.920609 C 187.643799 0.920609 184.995667 2.072029 183.038452 3.91433 L 94.839851 94.069664 L 107.160034 94.069664 L 18.962023 3.91433 C 17.119766 2.072029 14.471518 0.920609 11.477831 0.920609 C 5.490494 0.920609 1 5.526199 1 11.513611 C 1 14.392136 2.151409 16.925194 4.108808 18.997719 L 93.227982 110.189545 C 95.415573 112.376678 98.063828 113.528603 101.057533 113.528603 Z"/>
<text class="sec" x="306" y="86">Apple Maps directions, online only</text>
</g></g>
<!-- while typing: the search rows -->
<g class="a results">
<text class="sec" x="284" y="128" style="font-size:12px;font-weight:600">Places</text>
<circle cx="296" cy="162" r="12" fill="#007AFF"/>
<text x="318" y="158">Mill Pond</text>
<text class="sec" x="318" y="177" style="font-size:12px">Ashford</text>
<rect x="548" y="153.5" width="48" height="17" rx="8.5" class="fld"/>
<text class="sec" x="572" y="166" style="font-size:11px;text-anchor:middle">Places</text>
<circle class="a t3" cx="400" cy="162" r="18" style="fill:#000;fill-opacity:.18"/>
</g>
<!-- with two stops: line 1 -->
<g class="a line1">
<circle cx="279" cy="164" r="7" class="or"/>
<path fill="#FF9500" transform="translate(289,161.5) scale(0.045)" d="M 101.057533 113.528603 C 103.93605 113.528603 106.814575 112.376678 108.771904 110.189545 L 197.890854 18.882629 C 199.848068 16.925194 201 14.392136 201 11.513611 C 201 5.526199 196.509033 0.920609 190.521835 0.920609 C 187.643799 0.920609 184.995667 2.072029 183.038452 3.91433 L 94.839851 94.069664 L 107.160034 94.069664 L 18.962023 3.91433 C 17.119766 2.072029 14.471518 0.920609 11.477831 0.920609 C 5.490494 0.920609 1 5.526199 1 11.513611 C 1 14.392136 2.151409 16.925194 4.108808 18.997719 L 93.227982 110.189545 C 95.415573 112.376678 98.063828 113.528603 101.057533 113.528603 Z"/>
<text x="306" y="170"><tspan class="bold">1.24 km</tspan><tspan class="sec"> • </tspan><tspan class="bold">16 min</tspan></text>
<circle cx="554" cy="164" r="7" class="or"/>
<circle cx="590" cy="164" r="7" class="or"/>
</g>
<!-- at the cap: a crop of the list scrolled to its end, faded flat above and below; it rides under the card above -->
<g id="list" class="a">
<rect x="256" y="124" width="368" height="10" fill="url(#fup)"/>
<rect x="256" y="134" width="368" height="132" fill="#fff"/>
<rect x="256" y="266" width="368" height="10" fill="url(#fdn)"/>
<g transform="translate(0,140)"><rect x="272" width="336" height="36" rx="10" class="fld"/>
<circle cx="293" cy="18" r="13" class="or"/>
<text class="badge" x="293" y="23">13</text>
<text x="314" y="24">Fern Hill Rd</text>
<line x1="560" y1="18" x2="576" y2="18" class="hdl"/>
<circle cx="592" cy="18" r="8" class="ter"/></g>
<g transform="translate(0,182)"><rect x="272" width="336" height="36" rx="10" class="fld"/>
<circle cx="293" cy="18" r="13" class="or"/>
<text class="badge" x="293" y="23">14</text>
<text x="314" y="24">Quarry Ln</text>
<line x1="560" y1="18" x2="576" y2="18" class="hdl"/>
<circle cx="592" cy="18" r="8" class="ter"/></g>
<g transform="translate(0,224)"><rect x="272" width="336" height="36" rx="10" class="fld"/><circle cx="287" cy="18" r="6" fill="none" stroke="#3C3C43" stroke-opacity=".6" stroke-width="2"/><text class="ph" x="303" y="24">14 stops is the most</text></g>
<text class="sec" x="440" y="294" style="font-size:13px;text-anchor:middle">The list at 14 stops</text>
</g>
</svg>
