.ins{transform-box:fill-box;transform-origin:0 0;animation-name:ins} @keyframes ins{0%,22%{transform:scaleX(0);opacity:0}23%{transform:scaleX(0.004);opacity:1}50%,92%{transform:scaleX(1);opacity:1}96%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
.rfade{transform-box:fill-box;transform-origin:100% 0;animation-name:rfade} @keyframes rfade{0%,22%{transform:scaleX(1);opacity:0}23%{transform:scaleX(1);opacity:1}50%,92%{transform:scaleX(0.5000);opacity:1}96%{transform:scaleX(0.5000);opacity:0}100%{transform:scaleX(1);opacity:0}}
.endr{animation-name:endr} @keyframes endr{0%,22%{transform:translateX(0);opacity:0}23%{transform:translateX(0);opacity:1}50%,92%{transform:translateX(249.6px);opacity:1}96%,100%{transform:translateX(249.6px);opacity:0}}
.finger{animation-name:finger} @keyframes finger{0%,11%{opacity:0;transform:translateX(0)}13%,22%{opacity:.9;transform:translateX(0)}50%{opacity:.9;transform:translateX(249.6px)}54%,100%{opacity:0;transform:translateX(249.6px)}}
.hold{transform-box:fill-box;transform-origin:50% 50%;animation-name:hold} @keyframes hold{0%,13%{opacity:0;transform:scale(1)}14%{opacity:.8;transform:scale(1)}21%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}
@media (prefers-reduced-motion: reduce){
.a{animation:none}
.rim,.finger,.hold{opacity:0}
.own{opacity:.5}
.grow{stroke-dashoffset:0;opacity:1}
.on1{opacity:1}
.mend{transform:translate(372.8px,54.6px) rotate(11.4deg);opacity:1}
.ins{transform:scaleX(1);opacity:1}
.rfade{transform:scaleX(0.5000);opacity:1}
.endr{transform:translateX(249.6px);opacity:1}
}
</style>
