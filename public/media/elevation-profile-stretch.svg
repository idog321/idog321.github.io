<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="-apple-system, system-ui, sans-serif">
<title>Selecting a stretch of the elevation profile: a hold and drag across the chart lights the stretch on the map, and the numbers under the chart switch to the stretch's own</title>
<style>
.a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
.rim{animation-name:rim} @keyframes rim{0%,22%{opacity:1}23%,92%{opacity:0}96%,100%{opacity:1}}
.own{animation-name:own} @keyframes own{0%,22%{opacity:1}23%,92%{opacity:.5}96%,100%{opacity:1}}
.grow{stroke-dasharray:243.1 253.1;animation-name:grow} @keyframes grow{0%,22%{stroke-dashoffset:243.1;opacity:1}50%,92%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:243.1;opacity:0}}
.on1{animation-name:on1} @keyframes on1{0%,22%{opacity:0}23%,92%{opacity:1}96%,100%{opacity:0}}
